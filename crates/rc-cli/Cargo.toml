[package]
name = "rc-cli"
version = "0.16.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rc"
path = "src/main.rs"

[features]
# Development and CI use the platform OpenSSL already required by
# webauthn-rs-core. Release archives enable this explicitly so the unified
# rc binary remains self-contained on target machines.
vendored-openssl = ["rc-crypto/vendored-openssl"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
libc.workspace = true
rand.workspace = true
nix.workspace = true
rc-api-client = { path = "../rc-api-client" }
rc-crypto = { path = "../rc-crypto" }
rc-node = { path = "../rc-node" }
rc-protocol = { path = "../rc-protocol" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
url.workspace = true
webrtc.workspace = true
