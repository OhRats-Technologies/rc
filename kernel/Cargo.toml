[package]
name = "rc-kernel"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "UNLICENSED"

[[bin]]
name = "rc-kernel"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
aes-gcm = "0.10.3"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive", "env"] }
ed25519-dalek = "2.2.0"
getrandom = "0.3.4"
hkdf = "0.12.4"
notify = "8.2.0"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
rc-node = { path = "../crates/rc-node" }
rc-protocol = { path = "../crates/rc-protocol" }
rusqlite = { version = "0.37.0", features = ["backup", "bundled"] }
semver = "1.0.28"
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-stream = "0.1.18"
wasmtime = { version = "48.0.1", default-features = false, features = ["anyhow", "cache", "component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "48.0.1", default-features = false, features = ["p2"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

[dev-dependencies]
tempfile = "3.23.0"

[workspace]

[profile.release]
lto = "thin"
codegen-units = 16
strip = "debuginfo"
