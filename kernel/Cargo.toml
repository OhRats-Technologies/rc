[package]
name = "rc-kernel"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"

[features]
windows-test-fixture = []

[[bin]]
name = "rc-kernel"
path = "src/main.rs"

[[bin]]
name = "rc-windows-execution-guard-fixture"
path = "src/bin/windows-execution-guard-fixture.rs"
test = false
required-features = ["windows-test-fixture"]

[dependencies]
anyhow = "1.0.104"
aes-gcm = "0.10.3"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive", "env"] }
ed25519-dalek = "2.2.0"
getrandom = "0.3.4"
hkdf = "0.12.4"
notify = "8.2.0"
parking_lot = "0.12.5"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
rc-node = { path = "../crates/rc-node" }
rc-platform = { path = "../crates/rc-platform" }
rc-protocol = { path = "../crates/rc-protocol" }
rusqlite = { version = "0.37.0", features = ["backup", "bundled"] }
semver = "1.0.28"
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-stream = "0.1.18"
wasmtime = { version = "48.0.1", default-features = false, features = ["anyhow", "cache", "component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "48.0.1", default-features = false, features = ["p2"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

[dev-dependencies]
tempfile = "3.23.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"
nix = { version = "0.31.3", features = ["fs", "process", "signal", "term"] }

[target.'cfg(windows)'.dependencies]
portable-pty = "0.9.0"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[workspace]

[profile.release]
lto = "thin"
codegen-units = 16
strip = "debuginfo"
