<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Relay | OhRats</title>
  <link rel="icon" href="https://assets.ohrats.party/current/logo.png">
  <link rel="stylesheet" href="https://assets.ohrats.party/current/ohrats.css">
  <link rel="stylesheet" href="/relay.css?v=6">
  <script src="https://assets.ohrats.party/current/theme.js"></script>
</head>
<body>
  <section id="auth" class="auth-shell" hidden>
    <div class="auth-panel">
      <p class="eyebrow">RELAY / CONTROL PLANE</p>
      <h1 id="auth-title">Sign in</h1>
      <p id="auth-copy" class="muted">Use a passkey to continue.</p>
      <form id="setup-form" class="form-stack" hidden>
        <label>Name<input name="name" autocomplete="name" required autofocus></label>
        <button class="primary-button" type="submit">CREATE PASSKEY</button>
      </form>
      <form id="login-form" class="form-stack" hidden>
        <button class="primary-button" type="submit">SIGN IN WITH PASSKEY</button>
      </form>
      <form id="register-form" class="form-stack" hidden>
        <label>Name<input name="name" autocomplete="name" required></label>
        <input name="invite" type="hidden">
        <button class="primary-button" type="submit">CREATE PASSKEY</button>
        <button id="existing-account" class="text-button" type="button">SIGN IN INSTEAD</button>
      </form>
      <p id="auth-error" class="error" role="alert"></p>
    </div>
  </section>

  <div id="site-shell" class="site-shell" hidden>
    <aside id="site-sidebar" class="site-sidebar">
      <div class="sidebar-scroll">
        <a class="site-brand" href="/devices">
          <img src="https://assets.ohrats.party/current/logo.png" alt="">
          <strong>Relay</strong>
        </a>
        <nav aria-label="Relay navigation">
          <section class="sidebar-section">
            <h2>Navigation</h2>
            <a class="nav-link" data-nav="devices" href="/devices"><span class="ui-icon icon-devices"></span><span>Devices</span></a>
            <a class="nav-link" data-nav="workspaces" href="/workspaces"><span class="ui-icon icon-workspaces"></span><span>Workspaces</span></a>
          </section>
          <section class="sidebar-section">
            <h2>Workspaces</h2>
            <div id="workspace-links"></div>
          </section>
        </nav>
      </div>
      <div class="sidebar-footer">
        <div class="profile-row">
          <a class="profile-link" href="/account"><span id="profile-initial" class="profile-initial"></span><span id="profile-name"></span></a>
          <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle theme"></button>
          <button id="logout" class="icon-button" type="button" aria-label="Sign out" title="Sign out"><span class="ui-icon icon-sign-out"></span></button>
        </div>
      </div>
    </aside>
    <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-expanded="true" aria-controls="site-sidebar" aria-label="Close sidebar">
      <span class="ui-icon icon-sidebar"></span>
    </button>
    <main id="page" class="site-content"></main>
  </div>
  <script type="module" src="/app.js?v=6"></script>
</body>
</html>
