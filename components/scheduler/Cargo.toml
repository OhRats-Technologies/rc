[package]
name = "rc-scheduler"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
cron = "0.17.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wit-bindgen = "0.61.1"

[workspace]
