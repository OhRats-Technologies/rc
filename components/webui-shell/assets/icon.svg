<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="RC">
  <defs>
    <linearGradient id="tileBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242220"/>
      <stop offset="100%" stop-color="#171614"/>
    </linearGradient>
    <clipPath id="sqClip">
      <rect width="512" height="512" rx="96" ry="96"/>
    </clipPath>
  </defs>
  <g clip-path="url(#sqClip)">
    <!-- Matte charcoal hardware square -->
    <rect width="512" height="512" fill="url(#tileBg)"/>
    <!-- Subtle warm espresso edge so it stays crisp on dark browser tabs too -->
    <rect x="4" y="4" width="504" height="504" rx="92" fill="none" stroke="#624A3A" stroke-opacity="0.45" stroke-width="6"/>

    <!-- Top 4 channel status bars (signature C2 core detail) -->
    <rect x="74" y="76" width="66" height="18" rx="9" fill="#E27A3B"/>
    <rect x="156" y="76" width="66" height="18" rx="9" fill="#E27A3B"/>
    <rect x="238" y="76" width="66" height="18" rx="9" fill="#7A5438"/>
    <rect x="320" y="76" width="66" height="18" rx="9" fill="#463A32"/>

    <!-- Tactile horizontal split-flap seam -->
    <line x1="0" y1="274" x2="512" y2="274" stroke="#0A0908" stroke-width="5"/>
    <line x1="0" y1="278" x2="512" y2="278" stroke="#34312D" stroke-width="2"/>

    <!-- Crisp warm-ivory monospace 'rc' -->
    <text x="256" y="366"
          text-anchor="middle"
          font-family="'JetBrains Mono', 'SF Mono', 'DejaVu Sans Mono', ui-monospace, monospace"
          font-size="278"
          font-weight="700"
          letter-spacing="4"
          fill="#F4F3DF">rc</text>
  </g>
</svg>
