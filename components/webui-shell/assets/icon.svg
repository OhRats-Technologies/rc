<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="RC">
  <rect width="512" height="512" fill="#634936"/>
  <!-- Bold charcoal-ink top channel bars (2 lit ivory, 2 dark charcoal) -->
  <rect x="64" y="68" width="84" height="24" fill="#F4F3DF" stroke="#1D1D1B" stroke-width="10"/>
  <rect x="166" y="68" width="84" height="24" fill="#F4F3DF" stroke="#1D1D1B" stroke-width="10"/>
  <rect x="268" y="68" width="84" height="24" fill="#1D1D1B"/>
  <rect x="370" y="68" width="78" height="24" fill="#1D1D1B" opacity="0.45"/>
  <!-- Crisp warm-ivory 'rc' with bold charcoal outline -->
  <text x="256" y="382"
        text-anchor="middle"
        font-family="'JetBrains Mono', 'SF Mono', 'DejaVu Sans Mono', ui-monospace, monospace"
        font-size="292"
        font-weight="700"
        letter-spacing="-6"
        fill="#F4F3DF"
        stroke="#1D1D1B"
