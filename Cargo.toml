[workspace]
resolver = "2"
members = [
  "crates/rc-protocol",
  "crates/rc-crypto",
  "crates/rc-api-client",
  "crates/rc-node",
  "crates/rc-cli",
  "crates/rc-server",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "UNLICENSED"
repository = "https://github.com/OhRats-Technologies/rc"

[workspace.dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["http2", "json", "macros", "ws"] }
base64 = "0.22.1"
bytes = "1.10.1"
clap = { version = "4.5.47", features = ["derive"] }
dashmap = "6.1.0"
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "pkcs8"] }
futures-util = "0.3.31"
flate2 = "1.1.9"
hkdf = "0.12.4"
http = "1.3.1"
nix = { version = "0.31.3", features = ["fs", "process", "signal", "term"] }
libc = "0.2.177"
parking_lot = "0.12.5"
rand = "0.8.5"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.145"
serde_cbor_2 = "0.13.0"
semver = "1.0.27"
sha2 = "0.10.9"
signal-hook = "0.4.4"
thiserror = "2.0.16"
tar = "0.4.46"
tokio = { version = "1.47.1", features = ["full"] }
tokio-tungstenite = { version = "0.27.0", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6.6", features = ["compression-gzip", "cors", "fs", "request-id", "set-header", "trace"] }
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
webrtc = "0.14.0"
webauthn-rs = { version = "0.5.3", features = ["danger-allow-state-serialisation"] }
webauthn-rs-core = "=0.5.5"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = { version = "1.8.1", features = ["derive"] }
