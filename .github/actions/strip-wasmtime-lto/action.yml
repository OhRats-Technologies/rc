name: Strip wasmtime LTO sections
description: >-
  Remove LLVM LTO bitcode from wasmtime-go's static archive. Go 1.27.4 rejects
  .llvmbc/.llvmcmd (ELF) and __LLVM,__bitcode (Mach-O) in linker inputs; a
  normal non-LTO link never uses those sections.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        case "$(go env GOARCH)" in
          amd64) w=x86_64 ;;
          arm64) w=aarch64 ;;
          *) echo "unsupported arch: $(go env GOARCH)" >&2; exit 1 ;;
        esac
        case "$RUNNER_OS" in
          macOS) os=macos ;;
          Linux) os=linux ;;
          Windows) os=windows ;;
          *) echo "unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
        esac
        lib="$(go env GOMODCACHE)/github.com/bytecodealliance/wasmtime-go/v50@v50.0.0/build/$os-$w/libwasmtime.a"
        if [ ! -f "$lib" ]; then
          echo "wasmtime archive not found: $lib" >&2
          echo "run 'go mod download' first" >&2
          exit 1
        fi
        # GNU objcopy on Linux; the macOS runner image ships LLVM via Homebrew;
        # Windows runners carry MinGW objcopy from the Strawberry/MSYS toolchain.
        if command -v objcopy >/dev/null 2>&1; then
          objcopy=objcopy
        elif command -v llvm-objcopy >/dev/null 2>&1; then
          objcopy=llvm-objcopy
        elif [ "$RUNNER_OS" = "macOS" ] && brew_prefix=$(brew --prefix llvm@18 2>/dev/null) && [ -x "$brew_prefix/bin/llvm-objcopy" ]; then
          objcopy="$brew_prefix/bin/llvm-objcopy"
        elif [ "$RUNNER_OS" = "Windows" ]; then
          for candidate in /c/Strawberry/c/bin/objcopy.exe /c/msys64/mingw64/bin/objcopy.exe /c/mingw64/bin/objcopy.exe; do
            if [ -x "$candidate" ]; then objcopy="$candidate"; break; fi
          done
        fi
        if [ -z "${objcopy:-}" ]; then
          echo "no objcopy available" >&2
          exit 1
        fi
        tmp="$RUNNER_TEMP/libwasmtime.a"
        cp "$lib" "$tmp"
        chmod u+w "$tmp"
        if [ "$os" = "macos" ]; then
          # Mach-O names sections __SEGMENT,__section.
          "$objcopy" --remove-section=__LLVM,__bitcode --remove-section=__LLVM,__cmdline "$tmp"
        else
          "$objcopy" --remove-section=.llvmbc --remove-section=.llvmcmd "$tmp"
        fi
        chmod u+w "$lib"
        cp "$tmp" "$lib"
        # Fail loudly if the sections survived; a silent no-op would surface
        # later as a confusing linker error.
        if command -v llvm-objdump >/dev/null 2>&1 || llvm-objdump=$(command -v "$(dirname "$objcopy")/llvm-objdump" 2>/dev/null); then
          if llvm-objdump -h "$lib" 2>/dev/null | grep -qiE "llvmbc|__LLVM,__bitcode"; then
            echo "LTO sections still present in $lib" >&2
            exit 1
          fi
        fi
