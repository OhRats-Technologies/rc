name: Strip wasmtime LTO sections
description: >-
  Remove LLVM LTO bitcode from wasmtime-go's static archive. Go 1.26.11+
  rejects .llvmbc/.llvmcmd in linker inputs; a normal non-LTO link never
  uses those sections.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        case "$(go env GOARCH)" in
          amd64) w=x86_64 ;;
          arm64) w=aarch64 ;;
          *) echo "unsupported arch: $(go env GOARCH)" >&2; exit 1 ;;
        esac
        lib="$(go env GOMODCACHE)/github.com/bytecodealliance/wasmtime-go/v50@v50.0.0/build/linux-$w/libwasmtime.a"
        if [ ! -f "$lib" ]; then
          echo "wasmtime archive not found: $lib" >&2
          echo "run 'go mod download' first" >&2
          exit 1
        fi
        cp "$lib" "$RUNNER_TEMP/libwasmtime.a"
        chmod u+w "$RUNNER_TEMP/libwasmtime.a"
        objcopy --remove-section=.llvmbc --remove-section=.llvmcmd "$RUNNER_TEMP/libwasmtime.a"
        chmod u+w "$lib"
        cp "$RUNNER_TEMP/libwasmtime.a" "$lib"
