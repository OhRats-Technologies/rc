name: Strip wasmtime LTO sections
description: >-
  Remove LLVM LTO bitcode from wasmtime-go's static archive. Go rejects
  .llvmbc/.llvmcmd in linker inputs; a normal non-LTO link never uses those
  sections, so removing them changes nothing at runtime.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" = "Windows" ]; then
          echo "Windows links a different archive; nothing to strip."
          exit 0
        fi
        case "$(go env GOARCH)" in
          amd64) w=x86_64 ;;
          arm64) w=aarch64 ;;
          *) echo "unsupported arch: $(go env GOARCH)" >&2; exit 1 ;;
        esac
        # wasmtime-go ships one archive per host OS/arch pair.
        case "$RUNNER_OS" in
          macOS) os=macos ;;
          Linux) os=linux ;;
          *) echo "unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
        esac
        lib="$(go env GOMODCACHE)/github.com/bytecodealliance/wasmtime-go/v50@v50.0.0/build/$os-$w/libwasmtime.a"
        if [ ! -f "$lib" ]; then
          echo "wasmtime archive not found: $lib" >&2
          echo "run 'go mod download' first" >&2
          exit 1
        fi
        # llvm-objcopy ships with the macOS runner image; GNU objcopy with Linux.
        if command -v objcopy >/dev/null 2>&1; then
          objcopy=objcopy
        elif command -v llvm-objcopy >/dev/null 2>&1; then
          objcopy=llvm-objcopy
        else
          echo "no objcopy available" >&2
          exit 1
        fi
        tmp="$RUNNER_TEMP/libwasmtime.a"
        cp "$lib" "$tmp"
        chmod u+w "$tmp"
        "$objcopy" --remove-section=.llvmbc --remove-section=.llvmcmd "$tmp"
        chmod u+w "$lib"
        cp "$tmp" "$lib"
