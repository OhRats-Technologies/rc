name: RC core component bundle

on:
  push:
    branches: [main]
    paths:
      - wit/**
      - components/package-manager/**
      - components/artifact-cache-local/**
      - components/local-source/**
      - components/http-source/**
      - components/oci-source/**
      - components/github-source/**
      - components/diagnostics-store/**
      - components/diagnostics-reporter/**
      - components/diagnostics-cli/**
      - components/process-policy/**
      - components/transport-webrtc/**
      - components/updater/**
      - packaging/build-core-bundle.sh
      - scripts/build-component.sh
      - scripts/check-component.sh
      - .github/workflows/core-components.yml

permissions:
  contents: read

concurrency:
  group: rc-core-components-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            components/package-manager -> target
            components/local-source -> target
            components/http-source -> target
            components/oci-source -> target
            components/github-source -> target
            components/diagnostics-store -> target
            components/diagnostics-reporter -> target
            components/diagnostics-cli -> target
            components/process-policy -> target
            components/transport-webrtc -> target
            components/updater -> target
          shared-key: rc-core-components
          add-job-id-key: false
      - name: Build bootstrap components
        run: |
          for component in \
            artifact-cache-local \
            package-manager local-source http-source oci-source github-source \
            diagnostics-store diagnostics-reporter diagnostics-cli \
            process-policy transport-webrtc updater
          do
            scripts/check-component.sh "$component"
          done
      - name: Package portable core bundle
        run: |
          packaging/build-core-bundle.sh
          test "$(tar -tzf dist/rc-core-components.tar.gz | grep -c '\.wasm$')" -eq 12
          tar -xOf dist/rc-core-components.tar.gz profile.lock | grep -Fx 'profile ohrats:core'
      - uses: actions/upload-artifact@v7
        with:
          name: rc-core-components
          path: dist/rc-core-components.tar.gz
          if-no-files-found: error
          retention-days: 90
