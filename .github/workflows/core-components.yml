name: RC core component bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - wit/**
      - components/artifact-cache-local/**
      - components/package-manager/**
      - components/local-source/**
      - components/http-source/**
      - components/oci-source/**
      - components/github-source/**
      - components/diagnostics-store/**
      - components/diagnostics-reporter/**
      - components/diagnostics-cli/**
      - components/process-policy/**
      - components/execution-runtime/**
      - components/scheduler/**
      - components/shell/**
      - components/transport-webrtc/**
      - components/updater/**
      - packaging/build-core-bundle.sh
      - packaging/build-legacy-core-bundle.sh
      - scripts/build-component.sh
      - scripts/check-component.sh
      - scripts/profile-components.py
      - profiles/core.toml
      - .github/workflows/core-components.yml

permissions:
  contents: read

concurrency:
  group: rc-core-components-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/component-target
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> .ci/component-target
          shared-key: rc-core-components
          add-job-id-key: false
      - name: Build release components
        run: |
          for component in \
            artifact-cache-local \
            package-manager local-source http-source oci-source github-source \
            diagnostics-store diagnostics-reporter diagnostics-cli \
            process-policy execution-runtime scheduler shell transport-webrtc updater
          do
            scripts/build-component.sh "components/$component"
          done
      - name: Package portable core bundles
        run: |
          packaging/build-core-bundle.sh
          packaging/build-legacy-core-bundle.sh
          expected=$(python3 scripts/profile-components.py core | wc -l)
          test "$(tar -tzf dist/rc-core-profile.tar.gz | grep -c '\.wasm$')" -eq "$expected"
          test "$(tar -tzf dist/rc-core-profile.tar.gz | grep -c '^profile.lock$')" -eq 1
          tar -xOf dist/rc-core-profile.tar.gz profile.lock | grep -Fx 'profile ohrats:core'
          test "$(tar -tzf dist/rc-core-components.tar.gz | grep -c '\.wasm$')" -eq 10
          test "$(tar -tzf dist/rc-core-components.tar.gz | grep -c '^profile.lock$')" -eq 0
      - uses: actions/upload-artifact@v7
        with:
          name: rc-core-components
          path: |
            dist/rc-core-components.tar.gz
            dist/rc-core-profile.tar.gz
          if-no-files-found: error
          retention-days: 90
