name: RC kernel release assets

on:
  push:
    branches: [main]
    paths:
      - kernel/**
      - wit/**
      - .github/workflows/kernel-release.yml

permissions:
  contents: read

concurrency:
  group: rc-kernel-release-assets-main
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os: linux
            arch: amd64
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            os: linux
            arch: arm64
          - runner: macos-15
            target: aarch64-apple-darwin
            os: darwin
            arch: arm64
          - runner: macos-15
            target: x86_64-apple-darwin
            os: darwin
            arch: amd64
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: ${{ matrix.target }}
      - name: Restore kernel release cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel -> target
          shared-key: kernel-release-${{ matrix.target }}
          add-job-id-key: false
          cache-directories: ~/.cache/cargo-zigbuild
      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Linux'
        with:
          version: "0.16.0"
      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        run: |
          archive="$RUNNER_TEMP/cargo-zigbuild.tar.xz"
          directory="$RUNNER_TEMP/cargo-zigbuild"
          curl -fsSL \
            -o "$archive" \
            https://github.com/rust-cross/cargo-zigbuild/releases/download/v0.23.2/cargo-zigbuild-x86_64-unknown-linux-gnu.tar.xz
          echo "68f56ad657054afc04fa6f6b75a5752cec60378a046ad4e9441b9a06bd51211e  $archive" | sha256sum -c -
          mkdir -p "$directory"
          tar -xJf "$archive" -C "$directory" --strip-components=1 \
            cargo-zigbuild-x86_64-unknown-linux-gnu/cargo-zigbuild
          echo "$directory" >> "$GITHUB_PATH"
      - name: Build Linux kernel
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: -D warnings -A linker-messages
        run: >-
          cargo zigbuild --manifest-path kernel/Cargo.toml --locked --release
          --target ${{ matrix.target }}
      - name: Build macOS kernel
        if: runner.os == 'macOS'
        env:
          RUSTFLAGS: -D warnings
        run: >-
          cargo build --manifest-path kernel/Cargo.toml --locked --release
          --target ${{ matrix.target }}
      - name: Package kernel
        env:
          TARGET: ${{ matrix.target }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist/package
          cp "kernel/target/$TARGET/release/rc-kernel" dist/package/rc-kernel
          chmod 0755 dist/package/rc-kernel
          tar -C dist/package -czf "dist/rc-kernel-$OS-$ARCH.tar.gz" rc-kernel
      - uses: actions/upload-artifact@v7
        with:
          name: rc-kernel-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/rc-kernel-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7
