name: RC component release

on:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:
    inputs:
      component:
        description: Component directory name
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release metadata
        id: release
        env:
          COMPONENT: ${{ inputs.component }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            metadata=$(python3 scripts/release-component.py --component "$COMPONENT")
          else
            metadata=$(python3 scripts/release-component.py --tag "$REF_NAME")
            git merge-base --is-ancestor HEAD origin/main
          fi
          {
            echo "component=$(printf '%s' "$metadata" | jq -r .component)"
            echo "version=$(printf '%s' "$metadata" | jq -r .version)"
            echo "artifact=$(printf '%s' "$metadata" | jq -r .artifact)"
          } >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: components/${{ steps.release.outputs.component }} -> target
          shared-key: component-release-${{ steps.release.outputs.component }}
          add-job-id-key: false
      - name: Validate and build component
        env:
          COMPONENT: ${{ steps.release.outputs.component }}
        run: scripts/check-component.sh "$COMPONENT"
      - name: Attest component build
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/components/${{ steps.release.outputs.artifact }}.wasm
      - uses: oras-project/setup-oras@v1
      - name: Publish immutable OCI artifact
        env:
          ARTIFACT: ${{ steps.release.outputs.artifact }}
          COMPONENT: ${{ steps.release.outputs.component }}
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          reference="ghcr.io/$owner/rc-components/$COMPONENT:$VERSION"
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if oras resolve "$reference" >/dev/null 2>&1; then
            echo "component release already exists: $reference" >&2
            exit 1
          fi
          oras push "$reference" \
            --artifact-type application/vnd.ohrats.rc.component.v1 \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            "dist/components/$ARTIFACT.wasm:application/vnd.wasm.component.v1+wasm"
          digest=$(oras resolve "$reference")
          echo "Published \`oci:$reference\` (\`$digest\`)" >> "$GITHUB_STEP_SUMMARY"
