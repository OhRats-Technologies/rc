name: RC release assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - public/install.sh
      - public/install.ps1
      - scripts/check-version.sh
      - .github/workflows/release-prebuild.yml

permissions:
  contents: read

concurrency:
  group: rc-release-assets-main
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os: linux
            arch: amd64
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            os: linux
            arch: arm64
          - runner: macos-15
            target: aarch64-apple-darwin
            os: darwin
            arch: arm64
          - runner: macos-15
            target: x86_64-apple-darwin
            os: darwin
            arch: amd64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            os: windows
            arch: amd64
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: ${{ matrix.target }}
      - name: Verify Rust target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target list --installed | grep -Fx "$TARGET"
      - name: Restore release build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-v2-${{ matrix.target }}
          add-job-id-key: false
          cache-workspace-crates: true
          cache-directories: ~/.cache/cargo-zigbuild
      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Linux'
        with:
          version: "0.16.0"
      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        run: |
          archive="$RUNNER_TEMP/cargo-zigbuild.tar.xz"
          directory="$RUNNER_TEMP/cargo-zigbuild"
          curl -fsSL \
            -o "$archive" \
            https://github.com/rust-cross/cargo-zigbuild/releases/download/v0.23.2/cargo-zigbuild-x86_64-unknown-linux-gnu.tar.xz
          echo "68f56ad657054afc04fa6f6b75a5752cec60378a046ad4e9441b9a06bd51211e  $archive" | sha256sum -c -
          mkdir -p "$directory"
          tar -xJf "$archive" -C "$directory" --strip-components=1 cargo-zigbuild-x86_64-unknown-linux-gnu/cargo-zigbuild
          echo "$directory" >> "$GITHUB_PATH"
      - name: Build RC on Linux
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: -D warnings -A linker-messages
        run: cargo zigbuild --locked --release -p rc-cli --target ${{ matrix.target }}
      - name: Build RC on macOS
        if: runner.os == 'macOS'
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --locked --release -p rc-cli --target ${{ matrix.target }}
      - name: Build RC on Windows
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --locked --release -p rc-cli --target ${{ matrix.target }}
      - name: Package RC
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist/package
          suffix=""
          test "$OS" != windows || suffix=.exe
          cp "target/$TARGET/release/rc$suffix" "dist/package/rc$suffix"
          test "$OS" = windows || chmod 0755 dist/package/rc
          tar -C dist/package -czf "dist/rc-$OS-$ARCH.tar.gz" "rc$suffix"
      - uses: actions/upload-artifact@v7
        with:
          name: rc-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/rc-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7
