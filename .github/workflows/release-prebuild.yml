name: RC release assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - cmd/**
      - pkg/**
      - public/install.sh
      - public/install.ps1
      - scripts/check-version.sh
      - .github/workflows/release-prebuild.yml

permissions:
  contents: read

concurrency:
  group: rc-release-assets-main
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.3"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            cross: ""
          - runner: ubuntu-latest
            os: linux
            arch: arm64
            cross: aarch64-linux-gnu
          - runner: macos-15
            os: darwin
            arch: arm64
            cross: ""
          - runner: macos-15
            os: darwin
            arch: amd64
            cross: ""
          - runner: windows-latest
            os: windows
            arch: amd64
            cross: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install the Linux ARM64 cross compiler
        if: matrix.cross != ''
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Locate the Windows C compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @('C:\mingw64\bin', 'C:\msys64\mingw64\bin', 'C:\Strawberry\c\bin')
          $found = $false
          foreach ($candidate in $candidates) {
            if (Test-Path (Join-Path $candidate 'gcc.exe')) {
              $candidate | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              $found = $true
            }
          }
          if (-not $found) {
            throw 'no MinGW gcc is available for cgo'
          }
          gcc --version

      - name: Build RC on Linux
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CC: ${{ matrix.cross && format('{0}-gcc', matrix.cross) || 'gcc' }}
        run: go build -trimpath -buildvcs=false -o dist/package/rc ./cmd/rc
      - name: Build RC on macOS
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: go build -trimpath -buildvcs=false -o dist/package/rc ./cmd/rc
      - name: Build RC on Windows
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CC: gcc
        shell: bash
        run: go build -trimpath -buildvcs=false -o dist/package/rc.exe ./cmd/rc
      - name: Verify the release binary runs
        shell: bash
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          if [ "$OS:$ARCH" != "$(go env GOOS):$(go env GOARCH)" ]; then
            echo "cross-compiled $OS/$ARCH binary cannot execute on this runner"
            exit 0
          fi
          suffix=""
          test "$OS" != windows || suffix=.exe
          "./dist/package/rc$suffix" version | grep -F "$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' pkg/version/version.go)"
      - name: Package RC
        shell: bash
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          suffix=""
          test "$OS" != windows || suffix=.exe
          test "$OS" = windows || chmod 0755 dist/package/rc
          tar -C dist/package -czf "dist/rc-$OS-$ARCH.tar.gz" "rc$suffix"
      - uses: actions/upload-artifact@v7
        with:
          name: rc-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/rc-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7
