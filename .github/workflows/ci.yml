name: CI

on:
  workflow_dispatch:
    inputs:
      windows_only:
        description: Run only Windows runtime and installer checks
        type: boolean
        default: false
      windows_browser:
        description: Include Windows service enrollment and browser control in a focused run
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.windows_only && 'windows' || 'all' }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.3"
  # Product-level Windows checks need the full Node transport and browser
  # session implementation. Enable with the repository variable once available.
  RC_WINDOWS_RUNTIME_ENABLED: ${{ vars.RC_WINDOWS_RUNTIME_ENABLED || 'false' }}
  # Browser end-to-end coverage needs a server that renders the real WebUI.
  RC_BROWSER_E2E_ENABLED: ${{ vars.RC_BROWSER_E2E_ENABLED || 'false' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.affected.outputs.runtime }}
      components: ${{ steps.affected.outputs.components }}
      component-matrix: ${{ steps.affected.outputs.component_matrix }}
      profiles: ${{ steps.affected.outputs.profiles }}
      web: ${{ steps.affected.outputs.web }}
      browser: ${{ steps.affected.outputs.browser }}
      image: ${{ steps.affected.outputs.image }}
      deps: ${{ steps.affected.outputs.deps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: affected
        name: Resolve affected build units
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            python3 scripts/affected-units.py --all --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/affected-units.py --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT"
          fi

  static:
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install repository linters
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          directory="$RUNNER_TEMP/actionlint"
          curl -fsSL \
            -o "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c -
          mkdir -p "$directory"
          tar -xzf "$archive" -C "$directory" actionlint
          echo "$directory" >> "$GITHUB_PATH"
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l cmd pkg tests)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:" >&2
            printf '%s\n' "$unformatted" >&2
            exit 1
          fi
      - run: go vet ./...
      - run: sh scripts/check-version.sh
      - run: sh scripts/check-source-size.sh
      - run: python3 scripts/check-component-boundaries.py
      - run: python3 scripts/check-diagnostics-capabilities.py
      - run: python3 scripts/validate-components.py
      - run: python3 scripts/validate-profiles.py
      - run: python3 scripts/test-affected-units.py
      - run: python3 scripts/check-doc-links.py
      - run: python3 scripts/check-shared-assets.py
      - name: Run installer smoke
        run: sh scripts/smoke-install.sh
      - name: Validate shell entry points and workflows
        run: |
          sh -n docker-entrypoint.sh \
            public/install.sh scripts/*.sh
          shellcheck docker-entrypoint.sh \
            public/install.sh scripts/*.sh
          actionlint -shellcheck shellcheck .github/workflows/*.yml
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'public/install.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - run: git diff --check

  go-test:
    needs: changes
    if: ${{ !inputs.windows_only && (needs.changes.outputs.runtime == 'true' || needs.changes.outputs.deps == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install componentize-go
        run: |
          go install github.com/bytecodealliance/componentize-go@v0.5.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: go build ./...
      - run: go test -race ./...
      - name: Build without cgo
        env:
          CGO_ENABLED: "0"
        run: go build ./...

  components:
    needs: changes
    if: ${{ !inputs.windows_only && needs.changes.outputs.components != '[]' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.component-matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install componentize-go
        run: |
          go install github.com/bytecodealliance/componentize-go@v0.5.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: python3 scripts/validate-components.py
      - run: scripts/check-component.sh "${{ matrix.name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: rc-component-${{ matrix.name }}
          path: dist/components/${{ matrix.name }}.wasm
          if-no-files-found: error
          retention-days: 7

  profiles:
    needs: changes
    if: ${{ !inputs.windows_only && needs.changes.outputs.profiles != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: python3 scripts/validate-profiles.py
      - name: Assemble affected profiles
        env:
          PROFILES: ${{ needs.changes.outputs.profiles }}
        run: |
          for profile in $(python3 -c 'import json, os; print(" ".join(json.loads(os.environ["PROFILES"])))'); do
            python3 scripts/assemble-profile.py "$profile"
          done

  integration:
    needs: changes
    if: ${{ !inputs.windows_only && (needs.changes.outputs.runtime == 'true' || needs.changes.outputs.components != '[]' || needs.changes.outputs.deps == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install componentize-go
        run: |
          go install github.com/bytecodealliance/componentize-go@v0.5.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run Go integration harness
        run: go test ./tests/integration/ -count=1 -v

  macos-runtime:
    needs: changes
    if: ${{ !inputs.windows_only }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - name: Install componentize-go
        run: |
          go install github.com/bytecodealliance/componentize-go@v0.5.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run native component and server harness
        run: go test ./tests/integration/ -count=1 -v
      - name: Build native binaries
        run: |
          go build -o dist/rc ./cmd/rc
          go build -o dist/rc-server ./cmd/rc-server
          ./dist/rc version

  windows-runtime:
    needs: changes
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Parse Windows installer natively
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'public/install.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Exercise Windows installer archive validation
        shell: pwsh
        run: ./scripts/test-windows-installer-path.ps1
      - name: Build without cgo
        env:
          CGO_ENABLED: "0"
        run: go build ./...
      - name: Run portable runtime tests
        env:
          CGO_ENABLED: "0"
        run: go test ./pkg/platform/... ./pkg/protocol/... ./pkg/crypto/... ./pkg/mesh/... ./pkg/context/... ./pkg/apiclient/... ./pkg/node/...
      - name: Locate the Windows C compiler
        if: env.RC_WINDOWS_RUNTIME_ENABLED == 'true'
        shell: pwsh
        run: |
          $candidates = @('C:\mingw64\bin', 'C:\msys64\mingw64\bin', 'C:\Strawberry\c\bin')
          $found = $false
          foreach ($candidate in $candidates) {
            if (Test-Path (Join-Path $candidate 'gcc.exe')) {
              $candidate | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              $found = $true
            }
          }
          if (-not $found) { throw 'no MinGW gcc is available for cgo' }
      - name: Install componentize-go
        if: env.RC_WINDOWS_RUNTIME_ENABLED == 'true'
        shell: pwsh
        run: |
          go install github.com/bytecodealliance/componentize-go@v0.5.3
          (Join-Path (go env GOPATH) 'bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: oven-sh/setup-bun@v2
        if: env.RC_WINDOWS_RUNTIME_ENABLED == 'true' && (!inputs.windows_only || inputs.windows_browser)
        with:
          bun-version: "1.4.4"
      - name: Build Windows browser E2E fixtures
        if: env.RC_WINDOWS_RUNTIME_ENABLED == 'true' && (!inputs.windows_only || inputs.windows_browser)
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: |
          New-Item -ItemType Directory -Force target/debug,dist/components | Out-Null
          go build -o target/debug/rc.exe ./cmd/rc
          go build -o target/debug/rc-server.exe ./cmd/rc-server
          bun install --frozen-lockfile
          bun run build:client
          $versionLine = Select-String -Path pkg/version/version.go -Pattern 'var Version = "([^"]+)"'
          if (!$versionLine) { throw 'could not read RC version' }
          $version = $versionLine.Matches[0].Groups[1].Value
          $profile = Join-Path $env:RUNNER_TEMP 'rc-core-profile.tar.gz'
          Invoke-WebRequest -Uri "https://github.com/OhRats-Technologies/rc/releases/download/v$version/rc-core-profile.tar.gz" -OutFile $profile
          tar -xzf $profile -C dist
          foreach ($component in @('diagnostics-store','diagnostics-cli','process-policy','execution-runtime','scheduler','transport-webrtc')) {
            if (!(Test-Path "dist/components/$component.wasm")) { throw "missing release component: $component" }
          }
      - name: Run native component, server, and CLI harness
        if: env.RC_WINDOWS_RUNTIME_ENABLED == 'true'
        env:
          CGO_ENABLED: "1"
        run: go test ./... -count=1 -v
      - name: Exercise service execution and browser control in the logged-in Windows session
        if: env.RC_WINDOWS_RUNTIME_ENABLED == 'true' && (!inputs.windows_only || inputs.windows_browser)
        shell: pwsh
        run: ./scripts/windows-browser-e2e.ps1

  web:
    needs: changes
    if: ${{ !inputs.windows_only && (needs.changes.outputs.web == 'true' || needs.changes.outputs.browser == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:web
      - run: bun run build:client

  browser-e2e:
    needs: changes
    if: >-
      inputs.windows_only != true && vars.RC_BROWSER_E2E_ENABLED == 'true' && (
      needs.changes.outputs.browser == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.runtime == 'true' ||
      needs.changes.outputs.image == 'true')
    runs-on: ubuntu-latest
    env:
      RC_CDP_URL: http://127.0.0.1:9223
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun run build:client
      - name: Build Go binaries
        run: |
          go build -o dist/rc ./cmd/rc
          go build -o dist/rc-server ./cmd/rc-server
      - name: Install componentize-go
        run: |
          go install github.com/bytecodealliance/componentize-go@v0.5.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: bun run build:components
      - name: Start persistent Chrome DevTools
        run: |
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$chrome" \
            --headless=new \
            --no-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --remote-allow-origins='*' \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9223 \
            --user-data-dir="$RUNNER_TEMP/rc-chrome-e2e" \
            about:blank >"$RUNNER_TEMP/rc-chrome.log" 2>&1 &
          echo "RC_CHROME_PID=$!" >> "$GITHUB_ENV"
          attempts=0
          while [ "$attempts" -lt 300 ]; do
            if curl -fsS "$RC_CDP_URL/json/version" >/dev/null 2>&1; then
              exit 0
            fi
            attempts=$((attempts + 1))
            sleep 0.1
          done
          cat "$RUNNER_TEMP/rc-chrome.log" >&2
          exit 1
      - run: bun run smoke:browser-e2e
      - name: Show Chrome log after failure
        if: failure()
        run: cat "$RUNNER_TEMP/rc-chrome.log"

  dependency-security:
    needs: changes
    if: ${{ !inputs.windows_only && (needs.changes.outputs.deps == 'true' || needs.changes.outputs.runtime == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod verify
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun audit

  image:
    needs: changes
    if: ${{ !inputs.windows_only && (needs.changes.outputs.image == 'true' || needs.changes.outputs.runtime == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image with GitHub cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rc-ci
          cache-from: type=gha,scope=rc-ci-image
          cache-to: type=gha,mode=max,scope=rc-ci-image
      - name: Validate runtime image
        run: |
          docker run --rm --entrypoint /bin/sh rc-ci -c '
            command -v rc-server >/dev/null &&
            command -v rc >/dev/null &&
            command -v curl >/dev/null &&
            ! command -v bun >/dev/null 2>&1 &&
            ! command -v go >/dev/null 2>&1 &&
            test -d /app/assets &&
            test -x /usr/local/bin/rc-entrypoint &&
            test "$(id -u rc)" = 10001 &&
            test "$(id -g rc)" = 10001 &&
            rc-server --version
          '
      - run: sh scripts/smoke-container.sh rc-ci
