name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      kernel: ${{ steps.affected.outputs.kernel }}
      components: ${{ steps.affected.outputs.components }}
      component-matrix: ${{ steps.affected.outputs.component_matrix }}
      legacy-rust: ${{ steps.affected.outputs.legacy_rust }}
      legacy-security: ${{ steps.affected.outputs.legacy_security }}
      web: ${{ steps.affected.outputs.web }}
      image: ${{ steps.affected.outputs.image }}
      profiles: ${{ steps.affected.outputs.profiles }}
      profile-matrix: ${{ steps.affected.outputs.profile_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: affected
        name: Resolve affected build units
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            python3 scripts/affected-units.py --all --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/affected-units.py --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT"
          fi

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install repository linters
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          directory="$RUNNER_TEMP/actionlint"
          curl -fsSL \
            -o "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c -
          mkdir -p "$directory"
          tar -xzf "$archive" -C "$directory" actionlint
          echo "$directory" >> "$GITHUB_PATH"
      - run: sh scripts/check-version.sh
      - run: sh scripts/check-source-size.sh
      - run: python3 scripts/check-component-boundaries.py
      - run: python3 scripts/check-diagnostics-capabilities.py
      - run: python3 scripts/validate-components.py
      - run: python3 scripts/validate-profiles.py
      - run: python3 scripts/test-affected-units.py
      - run: python3 scripts/check-doc-links.py
      - name: Validate shell entry points and workflows
        run: |
          sh -n docker-entrypoint.sh docker/rc-ssh-authorized docker/rc-ssh-bridge \
            public/install.sh scripts/*.sh
          shellcheck docker-entrypoint.sh docker/rc-ssh-authorized docker/rc-ssh-bridge \
            public/install.sh scripts/*.sh
          actionlint -shellcheck shellcheck .github/workflows/*.yml
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'public/install.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - run: git diff --check

  kernel:
    needs: changes
    if: needs.changes.outputs.kernel == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel -> target
          shared-key: rc-kernel
          add-job-id-key: false
      - run: cargo fmt --manifest-path kernel/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path kernel/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path kernel/Cargo.toml --all-targets --locked

  components:
    needs: changes
    if: needs.changes.outputs.components != '[]'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.component-matrix) }}
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-wasip2
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: components/${{ matrix.name }} -> target
          shared-key: rc-component-${{ matrix.name }}
          add-job-id-key: false
      - run: python3 scripts/validate-components.py
      - run: scripts/check-component.sh "${{ matrix.name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: rc-component-${{ matrix.name }}
          path: dist/components/${{ matrix.name }}.wasm
          if-no-files-found: error
          retention-days: 7

  component-runtime:
    needs: [changes, components]
    if: always() && needs.changes.outputs.kernel == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kernel -> target
            components/fixture-provider -> target
            components/fixture-consumer -> target
            components/fixture-broken -> target
            components/fixture-collision -> target
            components/fixture-trap -> target
            components/fixture-limit -> target
          shared-key: rc-component-runtime
          add-job-id-key: false
      - uses: actions/download-artifact@v7
        if: needs.changes.outputs.components != '[]'
        with:
          pattern: rc-component-*
          path: dist/components
          merge-multiple: true
      - name: Exercise live component reconciliation
        env:
          COMPONENTS: ${{ needs.changes.outputs.components }}
        run: |
          if [ "$COMPONENTS" = '[]' ]; then
            scripts/smoke-kernel.sh
          else
            RC_SKIP_COMPONENT_BUILD=1 scripts/smoke-kernel.sh
          fi

  updater-runtime:
    needs: [changes, components]
    if: >-
      always() &&
      (needs.changes.outputs.kernel == 'true' ||
       contains(needs.changes.outputs.components, 'updater'))
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kernel -> target
            components/updater -> target
          shared-key: rc-updater-runtime
          add-job-id-key: false
      - uses: actions/download-artifact@v7
        if: contains(needs.changes.outputs.components, 'updater')
        with:
          name: rc-component-updater
          path: dist/components
      - name: Exercise native replacement recovery
        env:
          COMPONENTS: ${{ needs.changes.outputs.components }}
        run: |
          case "$COMPONENTS" in
            *updater*) RC_SKIP_COMPONENT_BUILD=1 scripts/smoke-updater.sh ;;
            *) scripts/smoke-updater.sh ;;
          esac

  package-runtime:
    needs: [changes, components]
    if: >-
      always() &&
      (needs.changes.outputs.kernel == 'true' ||
       contains(needs.changes.outputs.components, 'package-manager') ||
       contains(needs.changes.outputs.components, 'local-source') ||
       contains(needs.changes.outputs.components, 'http-source') ||
       contains(needs.changes.outputs.components, 'oci-source'))
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kernel -> target
            components/local-source -> target
            components/http-source -> target
            components/oci-source -> target
            components/package-manager -> target
            components/fixture-provider -> target
            components/fixture-provider-v2 -> target
          shared-key: rc-package-runtime
          add-job-id-key: false
      - run: scripts/smoke-packages.sh

  node-policy-runtime:
    needs: [changes, components]
    if: >-
      always() &&
      (needs.changes.outputs.kernel == 'true' ||
       needs.changes.outputs.legacy-rust == 'true' ||
       contains(needs.changes.outputs.components, 'process-policy') ||
       contains(needs.changes.outputs.components, 'transport-test') ||
       contains(needs.changes.outputs.components, 'transport-webrtc'))
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kernel -> target
            components/process-policy -> target
            components/transport-test -> target
            components/transport-webrtc -> target
          shared-key: rc-node-policy-runtime
          add-job-id-key: false
      - run: scripts/smoke-node-components.sh

  mesh-runtime:
    needs: [changes, components]
    if: >-
      always() &&
      (needs.changes.outputs.kernel == 'true' ||
       contains(needs.changes.outputs.components, 'mesh-policy') ||
       contains(needs.changes.outputs.components, 'mesh-policy-fixture'))
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kernel -> target
            components/mesh-policy -> target
            components/mesh-policy-fixture -> target
          shared-key: rc-mesh-runtime
          add-job-id-key: false
      - run: scripts/smoke-mesh-policy.sh

  authority-runtime:
    needs: [changes, components]
    if: >-
      always() &&
      (needs.changes.outputs.kernel == 'true' ||
       contains(needs.changes.outputs.components, 'authority-fixture') ||
       contains(needs.changes.outputs.components, 'authority-store') ||
       contains(needs.changes.outputs.components, 'crypto-ed25519'))
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kernel -> target
            components/authority-fixture -> target
            components/authority-store -> target
            components/crypto-ed25519 -> target
          shared-key: rc-authority-runtime
          add-job-id-key: false
      - run: scripts/smoke-authority.sh

  keys-runtime:
    needs: [changes, components]
    if: >-
      always() &&
      (needs.changes.outputs.kernel == 'true' ||
       contains(needs.changes.outputs.components, 'crypto-ed25519') ||
       contains(needs.changes.outputs.components, 'key-custody-fixture') ||
       contains(needs.changes.outputs.components, 'key-custody-local'))
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kernel -> target
            components/crypto-ed25519 -> target
            components/key-custody-fixture -> target
            components/key-custody-local -> target
          shared-key: rc-keys-runtime
          add-job-id-key: false
      - run: scripts/smoke-keys.sh

  control-crypto-runtime:
    needs: [changes, components]
    if: >-
      always() &&
      (needs.changes.outputs.kernel == 'true' ||
       contains(needs.changes.outputs.components, 'crypto-control'))
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kernel -> target
            components/crypto-control -> target
          shared-key: rc-control-crypto-runtime
          add-job-id-key: false
      - run: scripts/smoke-control-crypto.sh

  diagnostics-runtime:
    needs: [changes, components]
    if: >-
      always() &&
      (needs.changes.outputs.kernel == 'true' ||
       contains(needs.changes.outputs.components, 'diagnostics-') ||
       contains(needs.changes.outputs.components, 'webui-shell'))
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kernel -> target
            components/diagnostics-cli -> target
            components/diagnostics-mesh -> target
            components/diagnostics-reporter -> target
            components/diagnostics-store -> target
            components/diagnostics-ui -> target
            components/webui-shell -> target
          shared-key: rc-diagnostics-runtime
          add-job-id-key: false
      - run: python3 scripts/check-diagnostics-capabilities.py
      - run: scripts/smoke-diagnostics.sh

  identity-runtime:
    needs: [changes, components]
    if: >-
      always() &&
      (needs.changes.outputs.kernel == 'true' ||
       contains(needs.changes.outputs.components, 'identity-store') ||
       contains(needs.changes.outputs.components, 'identity-fixture'))
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kernel -> target
            components/identity-store -> target
            components/identity-fixture -> target
          shared-key: rc-identity-runtime
          add-job-id-key: false
      - run: scripts/smoke-identity.sh

  storage-runtime:
    needs: [changes, components]
    if: >-
      always() &&
      (needs.changes.outputs.kernel == 'true' ||
       contains(needs.changes.outputs.components, 'storage-fixture'))
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kernel -> target
            components/storage-fixture -> target
          shared-key: rc-storage-runtime
          add-job-id-key: false
      - run: scripts/smoke-storage.sh

  webauthn-runtime:
    needs: [changes, components]
    if: >-
      always() &&
      (needs.changes.outputs.kernel == 'true' ||
       contains(needs.changes.outputs.components, 'webauthn-es256') ||
       contains(needs.changes.outputs.components, 'webauthn-fixture'))
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kernel -> target
            components/webauthn-es256 -> target
            components/webauthn-fixture -> target
          shared-key: rc-webauthn-runtime
          add-job-id-key: false
      - run: scripts/smoke-webauthn.sh

  web-runtime:
    needs: [changes, components]
    if: >-
      always() &&
      (needs.changes.outputs.kernel == 'true' ||
       contains(needs.changes.outputs.components, 'webui-shell') ||
       contains(needs.changes.outputs.components, 'diagnostics-ui') ||
       contains(needs.changes.outputs.components, 'diagnostics-store'))
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kernel -> target
            components/diagnostics-store -> target
            components/diagnostics-ui -> target
            components/webui-shell -> target
          shared-key: rc-web-runtime
          add-job-id-key: false
      - run: scripts/smoke-web-runtime.sh

  profiles:
    needs: changes
    if: needs.changes.outputs.profiles != '[]'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.profile-matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 scripts/validate-components.py
      - run: python3 scripts/validate-profiles.py
      - run: python3 scripts/assemble-profile.py "${{ matrix.name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: rc-profile-${{ matrix.name }}
          path: dist/profiles/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 7

  legacy-rust-lint:
    needs: changes
    if: needs.changes.outputs.legacy-rust == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: legacy-validation
          add-job-id-key: false
          cache-bin: false
          save-if: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  legacy-rust-test:
    needs: changes
    if: needs.changes.outputs.legacy-rust == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: legacy-validation
          add-job-id-key: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"
      - name: Enable sccache
        run: |
          cat >> "$GITHUB_ENV" <<'EOF'
          SCCACHE_GHA_ENABLED=true
          SCCACHE_GHA_VERSION=rc-ci-v1
          RUSTC_WRAPPER=sccache
          EOF
      - run: cargo test --workspace --all-targets --locked
      - run: sccache --show-stats

  macos-runtime:
    needs: changes
    if: >-
      needs.changes.outputs.legacy-rust == 'true' ||
      needs.changes.outputs.kernel == 'true' ||
      contains(needs.changes.outputs.components, 'execution-runtime') ||
      contains(needs.changes.outputs.components, 'process-policy') ||
      contains(needs.changes.outputs.components, 'scheduler') ||
      contains(needs.changes.outputs.components, 'shell') ||
      contains(needs.changes.outputs.components, 'transport-webrtc')
    runs-on: macos-15
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kernel -> target
            components/diagnostics-store -> target
            components/process-policy -> target
            components/shell -> target
            components/execution-runtime -> target
            components/scheduler -> target
            components/transport-webrtc -> target
          shared-key: macos-runtime
          add-job-id-key: false
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --manifest-path kernel/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path kernel/Cargo.toml --all-targets --locked
      - name: Build portable runtime components
        run: |
          for component in diagnostics-store process-policy shell execution-runtime scheduler transport-webrtc; do
            scripts/build-component.sh "components/$component"
          done
      - name: Run component-backed runtime conformance natively
        run: |
          cargo build --manifest-path kernel/Cargo.toml --locked
          component_dir="$RUNNER_TEMP/rc-runtime-root/components"
          mkdir -p "$component_dir"
          for component in diagnostics-store process-policy shell execution-runtime scheduler transport-webrtc; do
            cp "dist/components/$component.wasm" "$component_dir/"
          done
          kernel/target/debug/rc-kernel --component-dir "$component_dir" policy-check

  windows-runtime:
    needs: changes
    if: >-
      needs.changes.outputs.legacy-rust == 'true' ||
      needs.changes.outputs.kernel == 'true' ||
      needs.changes.outputs.image == 'true' ||
      contains(needs.changes.outputs.components, 'execution-runtime') ||
      contains(needs.changes.outputs.components, 'process-policy') ||
      contains(needs.changes.outputs.components, 'scheduler') ||
      contains(needs.changes.outputs.components, 'shell') ||
      contains(needs.changes.outputs.components, 'transport-webrtc')
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt,clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-runtime
          add-job-id-key: false
      - run: cargo fmt --all --check
      - name: Build Windows execution guard fixture
        run: >-
          cargo build --manifest-path kernel/Cargo.toml --locked
          --features windows-test-fixture --bin rc-windows-execution-guard-fixture
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --manifest-path kernel/Cargo.toml --features windows-test-fixture --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path kernel/Cargo.toml --all-targets --locked
      - name: Build portable runtime components
        shell: bash
        run: |
          for component in diagnostics-store process-policy shell execution-runtime scheduler transport-webrtc; do
            scripts/build-component.sh "components/$component"
          done
      - name: Run component-backed runtime conformance natively
        shell: pwsh
        run: |
          cargo build --manifest-path kernel/Cargo.toml --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $componentDir = Join-Path $env:RUNNER_TEMP 'rc-runtime-root\components'
          New-Item -ItemType Directory -Force $componentDir | Out-Null
          'diagnostics-store','process-policy','shell','execution-runtime','scheduler','transport-webrtc' | ForEach-Object {
            Copy-Item "dist/components/$_.wasm" $componentDir
          }
          & 'kernel/target/debug/rc-kernel.exe' --component-dir $componentDir policy-check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Parse Windows installer natively
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'public/install.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Exercise Windows installer archive validation
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'rc-installer-shape'
          New-Item -ItemType Directory -Force $fixture | Out-Null
          $env:RC_INSTALL_BIN_DIR = Join-Path $fixture 'bin'
          $env:RC_DATA_DIR = Join-Path $fixture 'data'
          $env:RC_COMPONENT_DIR = Join-Path $fixture 'data\components'
          $env:RC_STATE_DIR = Join-Path $fixture 'state'
          . ./public/install.ps1 -ValidateFunctionsOnly
          $private = Join-Path $fixture 'private'
          Protect-PrivateDirectories @($private)
          $privateAcl = Get-Acl -LiteralPath $private
          if (!$privateAcl.AreAccessRulesProtected) { throw 'installer private DACL still inherits' }
          if ($privateAcl.Access | Where-Object { $_.IdentityReference.Value -in 'Everyone','BUILTIN\Users','NT AUTHORITY\Authenticated Users' }) {
            throw 'installer private DACL grants a broad principal'
          }
          if ((Parse-Kernel-Version 'RC kernel 2.3.0') -ne [version]'2.3.0') {
            throw 'installer kernel version parser failed'
          }
          $pointer = Join-Path $fixture 'atomic-pointer'
          Atomic-Text $pointer 'old'; Atomic-Text $pointer 'new'
          if ((Get-Content -Raw $pointer).Trim() -ne 'new' -or (Test-Path "$pointer.new-$PID")) {
            throw 'installer atomic pointer replacement failed'
          }
          $badRelease = [pscustomobject]@{tag_name='v2.3.0';assets=@([pscustomobject]@{
            name='rc-windows-amd64.tar.gz';browser_download_url='https://github.com/OhRats-Technologies/rc/releases/download/v2.2.0/rc-windows-amd64.tar.gz';digest=('sha256:' + ('0' * 64))
          })}
          try { Asset $badRelease 'rc-windows-amd64.tar.gz'; throw 'cross-release asset accepted' }
          catch { if ($_.Exception.Message -eq 'cross-release asset accepted') { throw } }
          try { Require-Kernel-NotDowngrade ([version]'2.2.9') ([version]'2.3.0'); throw 'downgrade accepted' }
          catch { if ($_.Exception.Message -eq 'downgrade accepted') { throw } }
          $old = Join-Path $Versions '1.0.0'; $current = Join-Path $Versions '2.0.0'
          $stale = Join-Path $Versions '0.9.0'; $unknown = Join-Path $Versions 'local'
          New-Item -ItemType Directory -Force $old,$current,$stale,$unknown | Out-Null
          Remove-StaleVersions $current $old
          if (!(Test-Path $old) -or !(Test-Path $current) -or (Test-Path $stale) -or !(Test-Path $unknown)) {
            throw 'installer version cleanup violated retention policy'
          }
          Set-Content -NoNewline (Join-Path $fixture 'rc.exe') 'fixture'
          Push-Location $fixture
          tar.exe -czf valid.tar.gz rc.exe
          Require-Single (Join-Path $fixture 'valid.tar.gz') 'rc.exe'
          Set-Content -NoNewline extra 'extra'
          tar.exe -czf invalid.tar.gz rc.exe extra
          $rejected = $false
          try { Require-Single (Join-Path $fixture 'invalid.tar.gz') 'rc.exe' }
          catch { $rejected = $true }
          Pop-Location
          if (!$rejected) { throw 'installer accepted an extra archive member' }
          New-Item -ItemType Directory -Force $Bin,$Components,$Runtime,(Join-Path $Backup 'components') | Out-Null
          Set-Content -NoNewline (Join-Path $Bin 'rc.exe') 'new-cli'
          Set-Content -NoNewline (Join-Path $Backup 'rc.exe') 'old-cli'
          Set-Content -NoNewline (Join-Path $Components 'shell.wasm') 'new-shell'
          Set-Content -NoNewline (Join-Path $Backup 'components\shell.wasm') 'old-shell'
          Set-Content -NoNewline (Join-Path $Runtime 'installed-version') '2.0.0'
          Set-Content -NoNewline (Join-Path $Backup 'installed-version') '1.0.0'
          Atomic-Text $Active 'C:\runtime\new'
          Atomic-Text $Journal (@{previous='C:\runtime\old';names=@('shell')} | ConvertTo-Json -Compress)
          Recover-InterruptedActivation
          if ((Get-Content -Raw (Join-Path $Bin 'rc.exe')) -ne 'old-cli') { throw 'CLI rollback failed' }
          if ((Get-Content -Raw (Join-Path $Components 'shell.wasm')) -ne 'old-shell') { throw 'component rollback failed' }
          if ((Get-Content -Raw $Active).Trim() -ne 'C:\runtime\old') { throw 'active runtime rollback failed' }
          if (Test-Path $Journal) { throw 'activation journal was not cleared after recovery' }

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:web
      - run: bun run build:client

  browser-e2e:
    needs: changes
    if: >-
      needs.changes.outputs.legacy-rust == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RC_CDP_URL: http://127.0.0.1:9223
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: browser-e2e
          add-job-id-key: false
          cache-bin: false
      - run: bun install --frozen-lockfile
      - run: bun run build:client
      - run: cargo build --locked -p rc-server --bin rc-server -p rc-cli --bin rc
      - run: cargo build --locked --manifest-path kernel/Cargo.toml
      - run: scripts/build-component.sh components/process-policy
      - run: scripts/build-component.sh components/transport-webrtc
      - name: Start persistent Chrome DevTools
        run: |
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --disable-features=WebRtcHideLocalIpsWithMdns \
            --remote-allow-origins='*' \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9223 \
            --user-data-dir="$RUNNER_TEMP/rc-chrome-e2e" \
            about:blank >"$RUNNER_TEMP/rc-chrome.log" 2>&1 &
          echo "RC_CHROME_PID=$!" >> "$GITHUB_ENV"
          attempt=0
          while [ "$attempt" -lt 100 ]; do
            if curl -fsS "$RC_CDP_URL/json/version" >/dev/null; then
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 0.1
          done
          cat "$RUNNER_TEMP/rc-chrome.log" >&2
          exit 1
      - run: bun run smoke:browser-e2e
      - name: Show Chrome log after failure
        if: failure()
        run: cat "$RUNNER_TEMP/rc-chrome.log"

  dependency-security:
    needs: changes
    if: needs.changes.outputs.legacy-security == 'true' || needs.changes.outputs.kernel == 'true' || needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.legacy-security == 'true'
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.legacy-security == 'true'
      - name: Install RustSec auditor
        run: |
          archive="$RUNNER_TEMP/cargo-audit.tgz"
          directory="$RUNNER_TEMP/cargo-audit"
          curl -fsSL \
            -o "$archive" \
            https://github.com/RustSec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz
          echo "ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39  $archive" | sha256sum -c -
          mkdir -p "$directory"
          tar -xzf "$archive" -C "$directory" --strip-components=1
          echo "$directory" >> "$GITHUB_PATH"
      - run: cargo-audit audit
        if: needs.changes.outputs.legacy-security == 'true'
      - run: bun audit
        if: needs.changes.outputs.legacy-security == 'true'
      - run: cargo-audit audit --file kernel/Cargo.lock
        if: needs.changes.outputs.kernel == 'true'
      - name: Audit affected component locks
        if: needs.changes.outputs.components != '[]'
        env:
          COMPONENTS: ${{ needs.changes.outputs.components }}
        run: |
          printf '%s' "$COMPONENTS" | jq -r '.[]' | while read -r name; do
            cargo-audit audit --file "components/$name/Cargo.lock"
          done

  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image with GitHub cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rc-ci
          cache-from: type=gha,scope=rc-ci-image
          cache-to: type=gha,mode=max,scope=rc-ci-image
      - name: Validate runtime image
        run: |
          docker run --rm --entrypoint /bin/sh rc-ci -c '
            command -v rc-server >/dev/null &&
            command -v rc-ssh-helper >/dev/null &&
            command -v curl >/dev/null &&
            command -v sshd >/dev/null &&
            ! command -v bun >/dev/null 2>&1 &&
            ! command -v go >/dev/null 2>&1 &&
            test -d /app/assets &&
            test -x /usr/local/bin/rc-entrypoint &&
            test "$(id -u rc)" = 10001 &&
            test "$(id -g rc)" = 10001 &&
            rc-server --version
          '
      - run: sh scripts/smoke-container.sh rc-ci
