name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt,clippy
      - name: Cache Rust validation build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rust-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rust-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:web
      - run: bun run build:client

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
      - name: Cache RustSec auditor
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-0.22.2-
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - name: Install RustSec auditor
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
      - run: bun audit

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install repository linters
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: sh scripts/check-version.sh
      - run: sh scripts/check-source-size.sh
      - run: python3 scripts/check-doc-links.py
      - name: Validate shell entry points
        run: |
          sh -n docker-entrypoint.sh docker/rc-ssh-authorized docker/rc-ssh-bridge public/install.sh scripts/check-source-size.sh scripts/check-version.sh scripts/smoke-container.sh
          shellcheck docker-entrypoint.sh docker/rc-ssh-authorized docker/rc-ssh-bridge public/install.sh scripts/check-source-size.sh scripts/check-version.sh scripts/smoke-container.sh
          "$(go env GOPATH)/bin/actionlint" -shellcheck shellcheck .github/workflows/*.yml
      - run: git diff --check

  image:
    needs: [rust, web, security, static]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image with GitHub cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rc-ci
          cache-from: type=gha,scope=rc-ci-image
          cache-to: type=gha,mode=max,scope=rc-ci-image
      - name: Validate runtime image
        run: |
          docker run --rm --entrypoint /bin/sh rc-ci -c '
            command -v rc-server >/dev/null &&
            command -v rc-ssh-helper >/dev/null &&
            command -v curl >/dev/null &&
            command -v sshd >/dev/null &&
            ! command -v bun >/dev/null 2>&1 &&
            ! command -v go >/dev/null 2>&1 &&
            test -d /app/assets &&
            test -x /usr/local/bin/rc-entrypoint &&
            test "$(id -u rc)" = 10001 &&
            test "$(id -g rc)" = 10001 &&
            rc-server --version
          '
      - name: Boot and exercise runtime image
        run: sh scripts/smoke-container.sh rc-ci
