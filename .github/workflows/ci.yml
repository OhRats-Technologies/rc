name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-lint:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt,clippy
      - name: Restore cleaned Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: validation-workspace-v1
          add-job-id-key: false
          cache-bin: false
          cache-workspace-crates: true
          save-if: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
      - name: Restore cleaned Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: validation-workspace-v1
          add-job-id-key: false
          cache-bin: false
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --all-targets

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:web
      - run: bun run build:client

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - name: Install RustSec auditor
        run: |
          archive="$RUNNER_TEMP/cargo-audit.tgz"
          directory="$RUNNER_TEMP/cargo-audit"
          curl -fsSL \
            -o "$archive" \
            https://github.com/RustSec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz
          echo "ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39  $archive" | sha256sum -c -
          mkdir -p "$directory"
          tar -xzf "$archive" -C "$directory" --strip-components=1
          echo "$directory" >> "$GITHUB_PATH"
      - run: cargo-audit audit
      - run: bun audit

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install repository linters
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          directory="$RUNNER_TEMP/actionlint"
          curl -fsSL \
            -o "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c -
          mkdir -p "$directory"
          tar -xzf "$archive" -C "$directory" actionlint
          echo "$directory" >> "$GITHUB_PATH"
      - run: sh scripts/check-version.sh
      - run: sh scripts/check-source-size.sh
      - run: python3 scripts/check-doc-links.py
      - name: Validate shell entry points
        run: |
          sh -n docker-entrypoint.sh docker/rc-ssh-authorized docker/rc-ssh-bridge public/install.sh scripts/check-source-size.sh scripts/check-version.sh scripts/smoke-container.sh
          shellcheck docker-entrypoint.sh docker/rc-ssh-authorized docker/rc-ssh-bridge public/install.sh scripts/check-source-size.sh scripts/check-version.sh scripts/smoke-container.sh
          actionlint -shellcheck shellcheck .github/workflows/*.yml
      - run: git diff --check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image with GitHub cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rc-ci
          cache-from: type=gha,scope=rc-ci-image
          cache-to: type=gha,mode=max,scope=rc-ci-image
      - name: Validate runtime image
        run: |
          docker run --rm --entrypoint /bin/sh rc-ci -c '
            command -v rc-server >/dev/null &&
            command -v rc-ssh-helper >/dev/null &&
            command -v curl >/dev/null &&
            command -v sshd >/dev/null &&
            ! command -v bun >/dev/null 2>&1 &&
            ! command -v go >/dev/null 2>&1 &&
            test -d /app/assets &&
            test -x /usr/local/bin/rc-entrypoint &&
            test "$(id -u rc)" = 10001 &&
            test "$(id -g rc)" = 10001 &&
            rc-server --version
          '
      - name: Boot and exercise runtime image
        run: sh scripts/smoke-container.sh rc-ci
