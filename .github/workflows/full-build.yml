name: RC full component build

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-full-component-build
  cancel-in-progress: true

jobs:
  component-stack:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-wasip2
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kernel -> target
            components/fixture-provider -> target
            components/fixture-consumer -> target
            components/fixture-broken -> target
            components/fixture-collision -> target
            components/fixture-trap -> target
            components/fixture-limit -> target
          shared-key: rc-full-component-build
          add-job-id-key: false
      - run: python3 scripts/check-component-boundaries.py
      - run: python3 scripts/validate-components.py
      - run: python3 scripts/validate-profiles.py
      - run: cargo fmt --manifest-path kernel/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path kernel/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path kernel/Cargo.toml --all-targets --locked
      - run: scripts/check-components.sh
      - run: scripts/smoke-kernel.sh
      - name: Assemble every profile without compiling code
        run: |
          for profile in profiles/*.toml; do
            name=${profile#profiles/}
            python3 scripts/assemble-profile.py "${name%.toml}"
          done
