name: RC full component build

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-full-component-build
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.3"

jobs:
  component-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install componentize-go
        run: |
          go install github.com/bytecodealliance/componentize-go@v0.5.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: python3 scripts/check-component-boundaries.py
      - run: python3 scripts/validate-components.py
      - run: python3 scripts/validate-profiles.py
      - run: go vet ./...
      - run: go test ./...
      - run: scripts/check-components.sh
      - run: go test ./tests/integration/ -count=1 -v
      - name: Assemble every profile without compiling code
        run: |
          for profile in profiles/*.toml; do
            name=${profile#profiles/}
            python3 scripts/assemble-profile.py "${name%.toml}"
          done
