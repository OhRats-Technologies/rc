name: RC release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify release tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          sh scripts/check-version.sh "$expected"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require successful CI for tagged commit
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$(( $(date +%s) + 2400 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            run="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch=main \
              -f event=push \
              -f head_sha="$GITHUB_SHA" \
              -f per_page=10 \
              --jq '.workflow_runs | if length == 0 then "" else (sort_by(.run_number) | last | [.status, (.conclusion // "pending"), .html_url] | join("|")) end')"
            if [ -n "$run" ]; then
              ci_status=${run%%|*}
              rest=${run#*|}
              conclusion=${rest%%|*}
              url=${rest#*|}
              case "$ci_status:$conclusion" in
                completed:success)
                  echo "CI passed for $GITHUB_SHA: $url"
                  exit 0
                  ;;
                completed:*)
                  echo "CI did not pass for $GITHUB_SHA ($conclusion): $url" >&2
                  exit 1
                  ;;
                *)
                  echo "waiting for CI on $GITHUB_SHA ($ci_status): $url"
                  ;;
              esac
            else
              echo "waiting for CI to start on $GITHUB_SHA"
            fi
            sleep 15
          done
          echo "timed out waiting for successful CI on $GITHUB_SHA" >&2
          exit 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download exact-SHA release assets
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$(( $(date +%s) + 2400 ))
          run_id=""
          ready=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            run="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/release-prebuild.yml/runs" \
              -f branch=main \
              -f event=push \
              -f head_sha="$GITHUB_SHA" \
              -f per_page=10 \
              --jq '.workflow_runs | if length == 0 then "" else (sort_by(.run_number) | last | [.id, .status, (.conclusion // "pending"), .html_url] | map(tostring) | join("|")) end')"
            if [ -n "$run" ]; then
              run_id=${run%%|*}
              rest=${run#*|}
              asset_status=${rest%%|*}
              rest=${rest#*|}
              conclusion=${rest%%|*}
              url=${rest#*|}
              case "$asset_status:$conclusion" in
                completed:success)
                  echo "release assets passed for $GITHUB_SHA: $url"
                  ready=1
                  break
                  ;;
                completed:*)
                  echo "release assets did not pass for $GITHUB_SHA ($conclusion): $url" >&2
                  exit 1
                  ;;
                *)
                  echo "waiting for release assets on $GITHUB_SHA ($asset_status): $url"
                  ;;
              esac
            else
              echo "waiting for release assets to start on $GITHUB_SHA"
            fi
            sleep 15
          done
          test "$ready" -eq 1 || { echo "timed out waiting for successful release assets on $GITHUB_SHA" >&2; exit 1; }
          mkdir -p dist
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --pattern 'rc-*' --dir dist
          find dist -mindepth 2 -maxdepth 2 -name 'rc-*.tar.gz' -exec mv {} dist/ \;
          find dist -mindepth 1 -type d -empty -delete
      - name: Validate release assets
        run: |
          test "$(find dist -maxdepth 1 -name 'rc-*.tar.gz' | wc -l)" -eq 4
          for name in rc-darwin-arm64 rc-darwin-amd64 rc-linux-arm64 rc-linux-amd64; do
            test -s "dist/$name.tar.gz"
            test "$(tar -tzf "dist/$name.tar.gz")" = "rc"
          done
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "RC ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/rc-*.tar.gz
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
