name: RC release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify release tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          sh scripts/check-version.sh "$expected"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require successful CI for tagged commit
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$(( $(date +%s) + 2400 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            run="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch=main \
              -f event=push \
              -f head_sha="$GITHUB_SHA" \
              -f per_page=10 \
              --jq '.workflow_runs | if length == 0 then "" else (sort_by(.run_number) | last | [.status, (.conclusion // "pending"), .html_url] | join("|")) end')"
            if [ -n "$run" ]; then
              ci_status=${run%%|*}
              rest=${run#*|}
              conclusion=${rest%%|*}
              url=${rest#*|}
              case "$ci_status:$conclusion" in
                completed:success)
                  echo "CI passed for $GITHUB_SHA: $url"
                  exit 0
                  ;;
                completed:*)
                  echo "CI did not pass for $GITHUB_SHA ($conclusion): $url" >&2
                  exit 1
                  ;;
                *)
                  echo "waiting for CI on $GITHUB_SHA ($ci_status): $url"
                  ;;
              esac
            else
              echo "waiting for CI to start on $GITHUB_SHA"
            fi
            sleep 15
          done
          echo "timed out waiting for successful CI on $GITHUB_SHA" >&2
          exit 1

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os: linux
            arch: amd64
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            os: linux
            arch: arm64
          - runner: macos-15
            target: aarch64-apple-darwin
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            os: darwin
            arch: amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: ${{ matrix.target }}
      - name: Verify Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target list --installed | grep -Fx "$TARGET"
      - name: Cache Rust release build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-release-
      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Linux'
        with:
          version: "0.16.0"
      - name: Cache cargo-zigbuild
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: ${{ runner.os }}-cargo-zigbuild-0.23.2
      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        run: command -v cargo-zigbuild >/dev/null || cargo install cargo-zigbuild --version 0.23.2 --locked
      - name: Build RC on Linux
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: -D warnings -A linker-messages
        run: cargo zigbuild --locked --release -p rc-cli --target ${{ matrix.target }}
      - name: Build RC on macOS
        if: runner.os == 'macOS'
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --locked --release -p rc-cli --target ${{ matrix.target }}
      - name: Package RC
        env:
          TARGET: ${{ matrix.target }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist/package
          cp "target/$TARGET/release/rc" dist/package/rc
          chmod 0755 dist/package/rc
          tar -C dist/package -czf "dist/rc-$OS-$ARCH.tar.gz" rc
      - uses: actions/upload-artifact@v7
        with:
          name: rc-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/rc-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rc-*
          path: dist
          merge-multiple: true
      - name: Validate release assets
        run: |
          test "$(find dist -maxdepth 1 -name 'rc-*.tar.gz' | wc -l)" -eq 4
          for name in rc-darwin-arm64 rc-darwin-amd64 rc-linux-arm64 rc-linux-amd64; do
            test -s "dist/$name.tar.gz"
            test "$(tar -tzf "dist/$name.tar.gz")" = "rc"
          done
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "RC ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/rc-*.tar.gz
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
