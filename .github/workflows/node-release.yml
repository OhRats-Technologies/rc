name: RC release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: rustfmt,clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - name: Install RustSec auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
      - run: bun audit
      - name: Verify release tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          sh scripts/check-version.sh "$expected"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: bun run typecheck
      - run: bun run build:client
      - run: sh scripts/check-source-size.sh
      - run: python3 scripts/check-doc-links.py

  build:
    needs: test
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os: linux
            arch: amd64
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            os: linux
            arch: arm64
          - runner: macos-15
            target: aarch64-apple-darwin
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            os: darwin
            arch: amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Linux'
        with:
          version: "0.16.0"
      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        run: cargo install cargo-zigbuild --version 0.23.2 --locked
      - name: Build RC on Linux
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: -D warnings -A linker-messages
        run: cargo zigbuild --locked --release -p rc-cli --target ${{ matrix.target }}
      - name: Build RC on macOS
        if: runner.os == 'macOS'
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --locked --release -p rc-cli --target ${{ matrix.target }}
      - name: Package RC
        env:
          TARGET: ${{ matrix.target }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist/package
          cp "target/$TARGET/release/rc" dist/package/rc
          chmod 0755 dist/package/rc
          tar -C dist/package -czf "dist/rc-$OS-$ARCH.tar.gz" rc
      - uses: actions/upload-artifact@v7
        with:
          name: rc-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/rc-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rc-*
          path: dist
          merge-multiple: true
      - name: Validate release assets
        run: |
          test "$(find dist -maxdepth 1 -name 'rc-*.tar.gz' | wc -l)" -eq 4
          for name in rc-darwin-arm64 rc-darwin-amd64 rc-linux-arm64 rc-linux-amd64; do
            test -s "dist/$name.tar.gz"
            test "$(tar -tzf "dist/$name.tar.gz")" = "rc"
          done
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "RC ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/rc-*.tar.gz
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
