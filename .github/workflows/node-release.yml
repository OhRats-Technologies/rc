name: RC release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify release tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          sh scripts/check-version.sh "$expected"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require successful CI for tagged commit
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$(( $(date +%s) + 2400 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            run="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch=main \
              -f event=push \
              -f head_sha="$GITHUB_SHA" \
              -f per_page=10 \
              --jq '.workflow_runs | if length == 0 then "" else (sort_by(.run_number) | last | [.status, (.conclusion // "pending"), .html_url] | join("|")) end')"
            if [ -n "$run" ]; then
              ci_status=${run%%|*}
              rest=${run#*|}
              conclusion=${rest%%|*}
              url=${rest#*|}
              case "$ci_status:$conclusion" in
                completed:success)
                  echo "CI passed for $GITHUB_SHA: $url"
                  exit 0
                  ;;
                completed:*)
                  echo "CI did not pass for $GITHUB_SHA ($conclusion): $url" >&2
                  exit 1
                  ;;
                *)
                  echo "waiting for CI on $GITHUB_SHA ($ci_status): $url"
                  ;;
              esac
            else
              echo "waiting for CI to start on $GITHUB_SHA"
            fi
            sleep 15
          done
          echo "timed out waiting for successful CI on $GITHUB_SHA" >&2
          exit 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact-SHA release assets
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$(( $(date +%s) + 2400 ))
          run_id=""
          ready=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            run="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/release-prebuild.yml/runs" \
              -f branch=main \
              -f head_sha="$GITHUB_SHA" \
              -f per_page=10 \
              --jq '.workflow_runs | map(select(.event == "push" or .event == "workflow_dispatch")) | if length == 0 then "" else (sort_by(.run_number) | last | [.id, .status, (.conclusion // "pending"), .html_url] | map(tostring) | join("|")) end')"
            if [ -n "$run" ]; then
              run_id=${run%%|*}
              rest=${run#*|}
              asset_status=${rest%%|*}
              rest=${rest#*|}
              conclusion=${rest%%|*}
              url=${rest#*|}
              case "$asset_status:$conclusion" in
                completed:success)
                  echo "release assets passed for $GITHUB_SHA: $url"
                  ready=1
                  break
                  ;;
                completed:*)
                  echo "release assets did not pass for $GITHUB_SHA ($conclusion): $url" >&2
                  exit 1
                  ;;
                *)
                  echo "waiting for release assets on $GITHUB_SHA ($asset_status): $url"
                  ;;
              esac
            else
              echo "waiting for release assets to start on $GITHUB_SHA"
            fi
            sleep 15
          done
          test "$ready" -eq 1 || { echo "timed out waiting for successful release assets on $GITHUB_SHA" >&2; exit 1; }
          mkdir -p dist
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --pattern 'rc-*' --dir dist
          find dist -mindepth 2 -maxdepth 2 -name 'rc-*.tar.gz' -exec mv {} dist/ \;
          find dist -mindepth 1 -type d -empty -delete
      - name: Download compatible kernel assets
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(scripts/find-compatible-workflow-run.sh \
            kernel-release.yml "$GITHUB_SHA" \
            kernel wit Cargo.toml Cargo.lock \
            crates/rc-api-client crates/rc-context crates/rc-crypto crates/rc-mesh \
            crates/rc-node crates/rc-protocol \
            .github/workflows/kernel-release.yml)
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --pattern 'rc-kernel-*' --dir dist/kernel
          find dist/kernel -mindepth 2 -maxdepth 2 -name 'rc-kernel-*.tar.gz' \
            -exec mv {} dist/ \;
          rm -rf dist/kernel
      - name: Download compatible core component bundle
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(scripts/find-compatible-workflow-run.sh \
            core-components.yml "$GITHUB_SHA" \
            wit \
            components/artifact-cache-local components/package-manager components/local-source components/http-source \
            components/oci-source components/github-source components/diagnostics-store \
            components/diagnostics-reporter components/diagnostics-cli \
            components/process-policy components/execution-runtime components/scheduler components/shell \
            components/transport-webrtc components/updater profiles/core.toml \
            packaging/build-core-bundle.sh packaging/build-legacy-core-bundle.sh \
            scripts/build-component.sh scripts/check-component.sh scripts/profile-components.py \
            .github/workflows/core-components.yml)
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name rc-core-components --dir dist/core
          mv dist/core/rc-core-components.tar.gz dist/
          mv dist/core/rc-core-profile.tar.gz dist/
          rmdir dist/core
      - name: Validate release assets
        run: |
          cp packaging/rc-upgrade.json dist/rc-upgrade.json
          {
            for name in rc-darwin-arm64 rc-darwin-amd64 rc-linux-arm64 rc-linux-amd64 rc-windows-amd64; do
              echo "$name.tar.gz"
            done
            for name in rc-kernel-darwin-arm64 rc-kernel-darwin-amd64 rc-kernel-linux-arm64 rc-kernel-linux-amd64 rc-kernel-windows-amd64; do
              echo "$name.tar.gz"
            done
            echo rc-core-components.tar.gz
            echo rc-core-profile.tar.gz
            echo rc-upgrade.json
          } | sort > "$RUNNER_TEMP/expected-assets"
          find dist -maxdepth 1 \( -name 'rc-*.tar.gz' -o -name 'rc-upgrade.json' \) -printf '%f\n' | sort > "$RUNNER_TEMP/actual-assets"
          cmp "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/actual-assets"
          for name in rc-darwin-arm64 rc-darwin-amd64 rc-linux-arm64 rc-linux-amd64; do
            test -s "dist/$name.tar.gz"
            test "$(tar -tzf "dist/$name.tar.gz")" = "rc"
          done
          test "$(tar -tzf dist/rc-windows-amd64.tar.gz)" = "rc.exe"
          for name in rc-kernel-darwin-arm64 rc-kernel-darwin-amd64 rc-kernel-linux-arm64 rc-kernel-linux-amd64; do
            test -s "dist/$name.tar.gz"
            test "$(tar -tzf "dist/$name.tar.gz")" = "rc-kernel"
          done
          test "$(tar -tzf dist/rc-kernel-windows-amd64.tar.gz)" = "rc-kernel.exe"
          test "$(tar -tzf dist/rc-core-components.tar.gz | grep -c '\.wasm$')" -eq 10
          test "$(tar -tzf dist/rc-core-components.tar.gz | grep -c '^profile.lock$')" -eq 0
          expected=$(python3 scripts/profile-components.py core | wc -l)
          test "$(tar -tzf dist/rc-core-profile.tar.gz | grep -c '\.wasm$')" -eq "$expected"
          test "$(tar -tzf dist/rc-core-profile.tar.gz | grep -c '^profile.lock$')" -eq 1
          python3 -m json.tool dist/rc-upgrade.json >/dev/null
          cp public/install.sh public/install.ps1 dist/
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "RC ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/rc-*.tar.gz dist/rc-upgrade.json dist/install.sh dist/install.ps1
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
